<div class="container">
  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Destination</th>
            <th>Prix</th>
            <th>Date Départ</th>
            <th>Type</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (voyage of voyages; track $index) {
            <tr>
              <td>{{voyage.idVoyage}}</td>
              <td>{{voyage.destination}}</td>
              <td>{{voyage.prix}}</td>
              <td>{{voyage.dateDepart | date: 'dd/MM/yyyy'}}</td>
              <td>{{voyage.type?.nomType}}</td>
              @if (authService.isAdmin()) {
                <td>
                  <a class="btn btn-danger" (click)="supprimerVoyage(voyage)">Supprimer</a>
                  <a class="btn btn-success" [routerLink]="['/updateVoyage', voyage.idVoyage]">Modifier</a>
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
